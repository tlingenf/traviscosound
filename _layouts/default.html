<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#ffe59a">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Open+Sans:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}" />

  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}" />
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}" />
  <meta property="og:image" content="{{ '/assets/images/socialcard.gif' | absolute_url }}" />
  <meta property="og:image:width" content="1080" />
  <meta property="og:image:height" content="566" />
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}" />
  <meta property="og:site_name" content="Travis Co Sound" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Home | Travis Co Sound" />
  <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}" />
  <meta name="twitter:image" content="{{ '/assets/images/socialcard.gif' | absolute_url }}" />

</head>

<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main id="main-content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>Travis Co Sound <span aria-hidden="true">/</span> Austin, Texas</p>
    <a href="#top">Back to top</a>
  </footer>
</body>

</html>
